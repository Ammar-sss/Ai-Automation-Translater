# 1. Import your .env file first
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.application.name=translatorservice

# 2. Database Connection (Pulled securely from your .env file)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 4. JWT Custom Properties
jwt.secret=${JWT_SECRET}
jwt.access-ttl-minutes=15
# 30 days in minutes
jwt.refresh-ttl-minutes=43200

# 5. CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# 6. Enable Scheduling
spring.task.scheduling.pool.size=10
spring.task.execution.pool.size=10


# 7. disable docker
spring.docker.compose.enabled=false

# 7. admin account
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# 8. N8N
# n8n.webhook-url=
# n8n.secret=

# 9
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 10. Ai api
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.2

# 12. caching
spring.cache.type=caffeine
spring.cache.cache-names=translations
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h