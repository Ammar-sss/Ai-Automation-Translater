# 1. Import your .env file first
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.application.name=translatorservice

# 2. Database Connection (Pulled securely from your .env file)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 4. JWT Custom Properties
jwt.secret=${JWT_SECRET}
jwt.access-ttl-minutes=15
# 30 days in minutes
jwt.refresh-ttl-minutes=43200

# 5. CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# 6. Enable Scheduling
spring.task.scheduling.pool.size=10
spring.task.execution.pool.size=10


# 7. disable docker
spring.docker.compose.enabled=false

# 7. admin account
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# 8. N*N
n8n.webhook-url=http://localhost:5678/webhook/translate
n8n.secret=${N8N_SECRET}