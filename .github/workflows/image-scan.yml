name: Image vulnerability scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # Pull requests: build the image without pushing it and fail the check on
    # fixable CRITICAL/HIGH findings. Add "scan" as a required check in the
    # branch ruleset so a vulnerable image cannot be merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          timeout: 10m
          cache: true

      - name: Scan image (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:scan
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          trivyignores: .trivyignore
          timeout: 10m
          cache: true
          skip-setup-trivy: 'true'

      # Needs a public repo or GitHub Advanced Security for code scanning.
      # Best effort: a missing licence must not fail the required check.
      - name: Upload findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  rescan:
    # Weekly and on demand: the published :latest is re-checked for CVEs
    # disclosed after it was built. Only alerts, never a gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the published image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          timeout: 10m
          cache: true

      - name: Scan published image (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          trivyignores: .trivyignore
          timeout: 10m
          cache: true
          skip-setup-trivy: 'true'

      - name: Upload findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
