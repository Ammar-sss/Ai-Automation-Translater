name: Publish Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # Build into the local daemon only: nothing reaches the registry until
      # the scan below has passed.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pick the commit-tagged reference
        id: ref
        run: echo "tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          timeout: 10m
          cache: true

      - name: Scan image (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.tag }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          trivyignores: .trivyignore
          timeout: 10m
          cache: true
          skip-setup-trivy: 'true'

      # Best effort: needs a public repo or GitHub Advanced Security.
      - name: Upload findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Push image
        run: printf '%s\n' "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
