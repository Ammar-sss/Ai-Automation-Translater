name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: translatorservice_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/translatorservice_db
      DB_USERNAME: postgres
      DB_PASSWORD: ci_password
      JWT_SECRET: "wvsgdnx4sUqPA16bYudpkW05qMIb8GSOy3cK/PfF6W0qGwIPFNH5jFkut+BTvAtG"
      ADMIN_USERNAME: ci_admin
      ADMIN_EMAIL: ci_admin@example.com
      ADMIN_PASSWORD: ci_admin_password
      N8N_SECRET: ci_n8n_secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn -B verify